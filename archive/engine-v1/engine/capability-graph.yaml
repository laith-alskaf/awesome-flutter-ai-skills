# AI Engineering OS - Machine-Readable Capability Graph
# This graph maps how skills relate to one another, enabling the Orchestrator to route tasks and resolve dependencies automatically.

skills:
  flutter-feature-planner:
    module: flutter
    layer: foundation
    consumes: [UserRequirements, ProjectContext]
    produces: [FeaturePlan, UseCases]
    depends_on: []
    delegates: []
    conflicts_with: []

  flutter-clean-architecture:
    module: flutter
    layer: foundation
    consumes: [FeaturePlan]
    produces: [ArchitectureDecision, FolderStructure, InterfaceDefinitions]
    depends_on: [flutter-feature-planner]
    delegates: [flutter-engineering-standards]
    conflicts_with: [mvc, mvvm]

  flutter-engineering-standards:
    module: flutter
    layer: foundation
    consumes: [SourceCode]
    produces: [LintedCode, FormattedCode, ReviewedCode]
    depends_on: []
    delegates: []
    conflicts_with: []

  flutter-ui-engineer:
    module: flutter
    layer: specialists
    consumes: [DesignRequirements, FeaturePlan]
    produces: [Widgets, Screens, Theme]
    depends_on: [flutter-clean-architecture]
    delegates: [flutter-animation-expert]
    conflicts_with: []

  flutter-api-expert:
    module: flutter
    layer: specialists
    consumes: [ApiContracts]
    produces: [Datasources, DTOs, Mappers]
    depends_on: [flutter-clean-architecture]
    delegates: []
    conflicts_with: []

  flutter-riverpod-expert:
    module: flutter
    layer: specialists
    consumes: [StateRequirements, UseCases]
    produces: [Providers, StateModels]
    depends_on: [flutter-clean-architecture]
    delegates: []
    conflicts_with: [flutter-bloc-expert, flutter-getx-expert]

  flutter-performance-expert:
    module: flutter
    layer: cross-cutting
    consumes: [SourceCode, DevToolsProfile, Benchmarks]
    produces: [OptimizedCode, PerformanceReport]
    depends_on: []
    delegates: []
    conflicts_with: []

  flutter-security-expert:
    module: flutter
    layer: cross-cutting
    consumes: [SourceCode, ArchitectureDecision]
    produces: [SecurityAudit, SecuredCode]
    depends_on: []
    delegates: []
    conflicts_with: []
